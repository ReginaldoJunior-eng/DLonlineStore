<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D.L Online Store — Erro</title>
<style>
  :root {
    --paper: #f1f3ee; --text: #16231d; --text-dim: #5b6a61;
    --line: rgba(22,35,29,.12); --azul: #0a66c2;
    --danger: #b23b32; --danger-bg: #f6dfdc;
    --shadow: 0 1px 2px rgba(22,35,29,.06), 0 8px 24px rgba(22,35,29,.05);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: #ffffff; border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow); padding: 36px 40px; max-width: 440px; text-align: center;
  }
  .card h1 { font-size: 20px; margin: 0 0 10px; }
  .card p { color: var(--text-dim); font-size: 14px; margin: 0 0 20px; }
  .btn-voltar {
    display: inline-block; border: none; border-radius: 8px; padding: 10px 20px;
    font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
    background: var(--azul); color: #f0f6ff; text-decoration: none;
  }

  /* Mesma barra de minimizar/fechar do resto do sistema — essencial aqui:
     sem ela, uma pessoa que cair nessa tela (erro inesperado) fica presa
     sem nenhum jeito de fechar a janela, já que ela é sem moldura. Foi
     exatamente isso que aconteceu de verdade uma vez (credencial do
     BigQuery faltando depois de reinstalar em outra máquina). */
  #janela-controles {
    position: fixed; top: 6px; right: 6px; z-index: 9999; display: none;
    gap: 2px; background: #ffffff; border: 1px solid var(--line);
    border-radius: 7px; padding: 2px;
  }
  #janela-controles button {
    width: 24px; height: 20px; border: none; border-radius: 5px; background: transparent;
    color: var(--text-dim); font-size: 11px; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
  }
  #janela-controles button:hover { background: rgba(10,102,194,.12); color: var(--azul); }
  #janela-controles button.btn-fechar-janela:hover { background: var(--danger-bg); color: var(--danger); }
</style>
</head>
<body>
<div id="janela-controles">
  <button type="button" onclick="window.pywebview.api.minimizar()" title="Minimizar">─</button>
  <button type="button" class="btn-fechar-janela" onclick="window.pywebview.api.fechar()" title="Fechar">✕</button>
</div>
<script>
  window.addEventListener('pywebviewready', function() {
    document.getElementById('janela-controles').style.display = 'flex';
  });
</script>
<div class="card">
  <h1>⚠️ Algo deu errado</h1>
  <p>Encontramos um erro inesperado. Tente voltar ao início — se continuar acontecendo, avise o suporte.</p>
  <a class="btn-voltar" href="/">Voltar ao início</a>
</div>
</body>
</html>
